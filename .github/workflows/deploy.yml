name: Test and Deploy Website

on:
  # Run tests and deploy when main is updated
  push:
    branches:
      - main

  # Run tests when a PR targets main
  pull_request:
    branches:
      - main

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================
  # JOB 1: TEST
  # ==================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Get repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run ESLint
      - name: Run ESLint
        run: pnpm lint

      # Install Playwright browser
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Execute Playwright tests
      - name: Run Playwright tests
        run: pnpm test

      # Save test report, even when tests fail
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ==================================
  # JOB 2: DEPLOY
  # ==================================
  deploy:
    name: Deploy to GitHub Pages

    # Only deploy if testing succeeds
    needs: test

    # Only deploy pushes to main, not PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Get repository code
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Prepare deployment directory
      - name: Prepare website files
        run: |
          mkdir _site

          cp index.html 404.html CNAME robots.txt sitemap.xml _site/

          cp -r assets css js _site/

          touch _site/.nojekyll

      # Upload website files
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
